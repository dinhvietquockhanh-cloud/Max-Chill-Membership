name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest
          run_install: false

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Cài đặt tất cả dependencies từ thư mục gốc của monorepo
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      # Build đúng project con bằng tính năng filter của pnpm workspace
      - name: Build project
        env:
          PORT: 5000
          BASE_PATH: /max-chill-membership/
        run: pnpm --filter max-chill-membership run build

      # Tạo file .nojekyll để tránh bị GitHub Pages ẩn các file hệ thống của Vite
      - name: Create .nojekyll
        run: touch artifacts/max-chill-membership/dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'artifacts/max-chill-membership/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
