name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Cài đặt pnpm vì project dùng catalog của pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest
          run_install: false

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Cài đặt thư viện bằng pnpm
      - name: Install dependencies
        working-directory: artifacts/max-chill-membership
        run: pnpm install

      # Build project bằng pnpm
      - name: Build project
        working-directory: artifacts/max-chill-membership
        env:
          PORT: 5000
          BASE_PATH: /Max-Chill-Membership/
        run: pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'artifacts/max-chill-membership/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
